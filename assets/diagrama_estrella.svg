<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="pk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="3" fill="#555"/></marker></defs>
<style>
.tt{fill:#ffffff;font-size:12.5px;font-weight:bold}
.c{fill:#1f2937;font-size:11px}
.k{fill:#1f3864;font-size:11px;font-weight:bold}
.ln{stroke:#6b7280;stroke-width:1.6;fill:none}
.lbl{fill:#6b7280;font-size:10px}
</style>
<rect width="1000" height="720" fill="#ffffff"/>
<text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3864">Modelo dimensional - Data Mart de partidas competitivas de League of Legends</text>

<!-- HECHO PRINCIPAL -->
<rect x="370" y="250" width="260" height="215" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="2.5"/>
<rect x="370" y="250" width="260" height="26" rx="6" fill="#1f3864"/>
<rect x="370" y="266" width="260" height="10" fill="#1f3864"/>
<text class="tt" x="500" y="268" text-anchor="middle">hecho_partida_equipo</text>
<text class="k" x="382" y="294">PK id_hecho</text>
<text class="k" x="382" y="310">FK id_tiempo, id_liga, id_equipo,</text>
<text class="k" x="382" y="324">      id_equipo_rival, id_parche, id_lado</text>
<line x1="378" y1="332" x2="622" y2="332" stroke="#d1d5db"/>
<text class="c" x="382" y="348">victoria (0/1)</text>
<text class="c" x="382" y="363">duracion_seg</text>
