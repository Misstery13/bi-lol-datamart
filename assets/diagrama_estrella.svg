<!-- RELACIONES -->
<path class="ln" d="M275,150 C330,150 345,250 370,290"/>
<path class="ln" d="M497,180 L497,250"/>
<path class="ln" d="M725,150 C660,150 640,250 628,292"/>
<path class="ln" d="M275,395 L368,380"/>
<path class="ln" d="M275,570 C320,570 350,480 370,440"/>
<path class="ln" d="M605,600 L698,580"/>

<text class="lbl" x="300" y="205">1 : N</text>
<text class="lbl" x="505" y="215">1 : N</text>
<text class="lbl" x="668" y="205">1 : N</text>
<text class="lbl" x="300" y="375">1 : N</text>
<text class="lbl" x="300" y="505">1 : N</text>
<text class="lbl" x="630" y="575">1 : N</text>

<text x="500" y="690" text-anchor="middle" font-size="11.5" fill="#4b5563">Granularidad del hecho principal: un registro representa la participacion de un equipo en una partida competitiva (dos registros por partida).</text>
<text x="500" y="708" text-anchor="middle" font-size="11.5" fill="#4b5563">El hecho secundario hecho_draft baja a nivel de campeon y comparte las mismas dimensiones.</text>
</svg>
