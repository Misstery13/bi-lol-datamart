<text class="c" x="382" y="393">oro_total, oro_dif_15</text>
<text class="c" x="382" y="408">dragones, barones, torres</text>
<text class="c" x="382" y="423">dano_campeones, vision_score</text>
<text class="c" x="382" y="438">primera_sangre, primer_dragon,</text>
<text class="c" x="382" y="452">primera_torre</text>

<!-- HECHO SECUNDARIO -->
<rect x="700" y="505" width="230" height="130" rx="6" fill="#ffffff" stroke="#2e5496" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="700" y="505" width="230" height="26" rx="6" fill="#2e5496"/>
<rect x="700" y="521" width="230" height="10" fill="#2e5496"/>
<text class="tt" x="815" y="523" text-anchor="middle">hecho_draft</text>
<text class="k" x="712" y="549">PK id_draft</text>
<text class="k" x="712" y="565">FK id_tiempo, id_liga, id_equipo,</text>
