<rect x="390" y="560" width="215" height="24" rx="6" fill="#10b981"/>
<rect x="390" y="574" width="215" height="10" fill="#10b981"/>
<text class="tt" x="497" y="577" text-anchor="middle">dim_campeon</text>
<text class="k" x="402" y="601">PK id_campeon</text>
<line x1="398" y1="609" x2="597" y2="609" stroke="#d1d5db"/>
