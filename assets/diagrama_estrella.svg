<rect x="60" y="340" width="215" height="110" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
<rect x="60" y="340" width="215" height="24" rx="6" fill="#10b981"/>
<rect x="60" y="354" width="215" height="10" fill="#10b981"/>
<text class="tt" x="167" y="357" text-anchor="middle">dim_parche</text>
<text class="k" x="72" y="381">PK id_parche</text>
<line x1="68" y1="389" x2="267" y2="389" stroke="#d1d5db"/>
